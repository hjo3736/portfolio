<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>posts-editor — 글 편집기 (로컬 전용)</title>
<style>
  /* 다크를 지원하지 않는다. 오류(#b00020)·성공(#0a7d32)·안내(#666)가 라이트 배경 기준으로 고른 색이라
     light dark 로 되돌리면 셋 다 AA 미달로 돌아간다 — 재 봤다: 2.87 / 3.99 / 3.26.
     다크를 하려면 플래그가 아니라 색 한 벌이 더 필요하다. */
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body { font: 15px/1.6 system-ui, sans-serif; margin: 0; padding: 24px; max-width: 920px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .hint { color: #666; font-size: 13px; margin: 0 0 20px; }
  .list-wrap { max-height: 45vh; overflow-y: auto; margin-bottom: 24px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
  th { font-weight: 600; color: #666; position: sticky; top: 0; background: Canvas; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: rgba(127, 127, 127, .12); }
  .state { white-space: nowrap; }
  form { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > label { flex: 1 1 200px; }
  label { display: grid; gap: 4px; font-size: 13px; color: #666; }
  input, textarea { font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 4px; background: transparent; color: inherit; }
  input[readonly] { opacity: .6; }
  textarea { min-height: 260px; resize: vertical; font-family: ui-monospace, monospace; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: inherit; }
  .actions { display: flex; align-items: center; gap: 12px; }
  button { font: inherit; padding: 8px 16px; border: 1px solid #888; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
  #message { font-size: 14px; }
  #message.error { color: #b00020; }
  #message.ok { color: #0a7d32; }
  .checkrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #guard { font-size: 13px; color: #b00020; }
</style>
</head>
<body>
<h1>글 편집기</h1>
<p class="hint">
  로컬 전용입니다. 저장하면 <code>content/posts.db</code>에 바로 씁니다.
  <strong>발행은 <code>npm run build</code>입니다</strong> — 이 화면은 발행하지 않습니다.
</p>

<div class="list-wrap">
<table>
  <thead><tr><th>상태</th><th>slug</th><th>제목</th><th>날짜</th></tr></thead>
  <tbody id="list"><tr><td colspan="4">불러오는 중…</td></tr></tbody>
</table>
</div>

<form id="form">
  <div class="row">
    <label>slug <small>(영문 소문자·숫자·하이픈)</small><input id="slug" required /></label>
    <label>날짜 <small>(YYYY-MM-DD)</small><input id="date" required /></label>
  </div>
  <label>제목<input id="title" required /></label>
  <label>설명<input id="description" required /></label>
  <div class="row">
    <label>분류<input id="category" required /></label>
    <label>태그 <small>(쉼표로 구분)</small><input id="tags" /></label>
  </div>
  <div class="checkrow"><label class="check"><input type="checkbox" id="draft" /> 초안 (공개하지 않음)</label><span id="guard"></span></div>
  <label>본문<textarea id="body" required></textarea></label>
  <div class="actions">
    <button type="submit">저장</button>
    <button type="button" id="new">새 글</button>
    <span id="message" role="alert"></span>
  </div>
</form>

<script>
const $ = id => document.getElementById(id);
let editing = null, posts = [], loaded = false;

function say(text, kind) { const box = $('message'); box.textContent = text; box.className = kind || ''; }

// 새 값이 아니라 상태를 보여 주는 줄이다. 조건은 서버의 400과 같다 — 공개 글이 이 글 하나뿐이면 내릴 수 없다.
function guardDraft() {
  if (!loaded) return;
  const slug = $('slug').value.trim(), box = $('draft'), reason = $('guard');
  box.disabled = !posts.filter(post => !post.draft && post.slug !== slug).length;
  reason.textContent = !box.disabled ? '' : posts.some(post => !post.draft)
    ? '공개 글이 이 글 하나뿐이라 초안으로 내릴 수 없습니다. 다른 글을 먼저 공개하세요.'
    : '공개 글이 한 편도 없어 초안으로 지정할 수 없습니다. 이 글을 먼저 공개로 저장하세요.';
}

function fill(post) {
  editing = post ? post.slug : null;
  $('slug').value = post ? post.slug : '';
  $('slug').readOnly = !!post;
  $('date').value = post ? post.date : new Date().toISOString().slice(0, 10);
  for (const id of ['title', 'description', 'category', 'body']) $(id).value = post ? post[id] : '';
  let tags = []; try { tags = JSON.parse(post ? post.tags : '[]'); } catch { tags = []; }
  $('tags').value = Array.isArray(tags) ? tags.join(', ') : '';
  $('draft').checked = post ? !!post.draft : false;
  guardDraft();
  say(post ? `${post.slug} 을(를) 불러왔습니다.` : '새 글을 씁니다. slug는 저장한 뒤에는 바꿀 수 없습니다.', 'ok');
}

async function load() {
  const response = await fetch('/api/posts');
  const data = await response.json();
  if (!response.ok) return say(data.error || '목록을 불러오지 못했습니다.', 'error');
  posts = data; loaded = true; guardDraft();
  const body = $('list');
  body.textContent = '';
  if (!posts.length) { const row = body.insertRow(); const cell = row.insertCell(); cell.colSpan = 4; cell.textContent = '글이 없습니다.'; return; }
  for (const post of posts) {
    const row = body.insertRow();
    row.insertCell().outerHTML = `<td class="state">${post.draft ? '초안' : '공개'}</td>`;
    row.insertCell().textContent = post.slug;
    row.insertCell().textContent = post.title;
    row.insertCell().textContent = post.date;
    row.onclick = () => fill(post);
    if (post.slug === editing) row.style.fontWeight = '600';
  }
}

$('new').onclick = () => fill(null);

$('form').onsubmit = async event => {
  event.preventDefault();
  say('저장하는 중…');
  const input = { slug: $('slug').value, date: $('date').value, title: $('title').value, description: $('description').value,
    category: $('category').value, body: $('body').value, draft: $('draft').checked,
    tags: $('tags').value.split(',').map(tag => tag.trim()).filter(Boolean) };
  const response = await fetch('/api/posts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input) });
  const result = await response.json();
  if (!response.ok) return say(result.error || '저장하지 못했습니다.', 'error');
  say(`${result.slug} 을(를) 저장했습니다. 발행하려면 npm run build 를 실행하세요.`, 'ok');
  editing = result.slug;
  $('slug').readOnly = true;
  await load();
};

fill(null);
load();
</script>
</body>
</html>
