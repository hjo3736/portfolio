name: Deploy to AWS

# main에 push하면 빌드·테스트 후 AWS에 올린다. 매주 월요일에도 돌아 GitHub 저장소 목록을 새로 고친다.
# 필요한 저장소 변수(Settings → Secrets and variables → Actions → Variables): infra/README.md 참고.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    # AWS 설정(infra/README.md)을 마치고 AWS_ROLE_ARN 변수를 넣기 전에는 건너뛴다.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 글 DB(content/posts.db)는 git에 없다. 저장소의 md 원본으로 만든다.
      - name: Import posts
        run: npm run posts:import

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SYNC_STRICT: '1'

      - run: npm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 해시가 붙은 에셋은 오래 캐시하고 지우지 않는다(이전 HTML을 연 방문자가 아직 받을 수 있다). HTML은 매번 확인한다.
      - name: Upload site
        run: |
          aws s3 sync dist/assets "s3://${{ vars.AWS_SITE_BUCKET }}/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://${{ vars.AWS_SITE_BUCKET }}" --delete --exclude "assets/*" --exclude "server/*" --exclude ".openai/*" --cache-control "no-cache"

      - name: Update comments API
        run: |
          (cd .aws-build/lambda && zip -q ../lambda.zip index.mjs)
          aws lambda update-function-code --function-name "${{ vars.AWS_API_FUNCTION }}" --zip-file fileb://.aws-build/lambda.zip > /dev/null
          aws lambda wait function-updated --function-name "${{ vars.AWS_API_FUNCTION }}"

      - name: Update page router
        run: |
          name="${{ vars.AWS_ROUTER_FUNCTION }}"
          etag=$(aws cloudfront describe-function --name "$name" --query ETag --output text)
          etag=$(aws cloudfront update-function --name "$name" --if-match "$etag" --function-config '{"Comment":"page routes (replaced on deploy)","Runtime":"cloudfront-js-2.0"}' --function-code fileb://.aws-build/router.js --query ETag --output text)
          aws cloudfront publish-function --name "$name" --if-match "$etag" > /dev/null

      - name: Invalidate cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" --paths "/*" > /dev/null
